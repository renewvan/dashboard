name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run
      - run: pnpm run build
