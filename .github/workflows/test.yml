name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true

      - run: vp test run
      - run: vp run build

      # The map's worker and glyph/sprite assets are found by URL at runtime, so nothing in the unit
      # tests (jsdom, mocked map) notices if the build stops emitting them: the map would ship blank.
      - name: Build emits the map's worker, fonts and sprites
        run: |
          ls dist/assets/maplibre-gl-worker-*.mjs
          test -f "dist/maps/fonts/Noto Sans Regular/0-255.pbf"
          test -f dist/maps/sprites/v4/dark.json
          test -f dist/maps/sprites/v4/light.json
