name: Release

on:
  release:
    types: [created]

jobs:
  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # Stable releases are cut from `main`, where test.yml already ran tests + build on the
      # merge commit. Re-running them here only repeats that. Pre-releases come from feature
      # branches that may never have been through test.yml, so they keep the gate.
      - uses: voidzero-dev/setup-vp@v1.21.2
        if: ${{ github.event.release.prerelease }}
        with:
          node-version-file: .node-version
          cache: true

      - name: Run tests
        if: ${{ github.event.release.prerelease }}
        run: vp test run

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          # A pre-release (e.g. a beta cut from a feature branch) publishes only its own
          # tag, so it can never take `:latest` from the stable line.
          tags: |
            ghcr.io/${{ github.repository_owner }}/dashboard:${{ github.event.release.tag_name }}
            ${{ !github.event.release.prerelease && format('ghcr.io/{0}/dashboard:latest', github.repository_owner) || '' }}

  # Skipped for pre-releases: it writes the version to `main`, which does not contain a
  # beta branch's code.
  bump-version:
    if: ${{ !github.event.release.prerelease }}
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Bump package.json version to match release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " "$version"

      - name: Commit and push
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if git diff --quiet -- package.json; then
            echo "package.json already at $TAG, nothing to commit"
            exit 0
          fi
          git config user.name "renewvan"
          git config user.email "github@renewvan.com"
          git add package.json
          git commit -m "chore: bump package.json version to match release tag $TAG"
          git push origin HEAD:main
